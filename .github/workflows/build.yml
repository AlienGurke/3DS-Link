name: 3DS-Link

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: 3dsx
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
    - name: Check out sources
      uses: actions/checkout@v6
    - name: Build
      run: make
    - uses: actions/upload-artifact@v7
      with:
        name: 3dsx-build
        path: |
          3DS-Link.3dsx
          3DS-Link.elf

  # makerom needs a newer glibc than the devkitPro container has
  cia:
    name: cia
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Check out sources
      uses: actions/checkout@v6
    - uses: actions/download-artifact@v7
      with:
        name: 3dsx-build
        path: .
    - name: Cache makerom/bannertool
      uses: actions/cache@v4
      with:
        path: cia/.tools
        key: cia-tools-v1
    - name: Build .cia (install with FBI for a Home Menu icon)
      env:
        GH_TOKEN: ${{ github.token }}
      run: sh cia/build-cia.sh 3DS-Link.elf 3DS-Link.cia
    - uses: actions/upload-artifact@v7
      with:
        name: 3DS-Link
        path: |
          3DS-Link.cia
          3DS-Link.3dsx
